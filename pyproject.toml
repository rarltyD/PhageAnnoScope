[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "phageannoscope"
version = "0.2.0"
description = "Reproducible comparison of bacteriophage CDS annotations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["biopython>=1.85,<2", "pyarrow>=19,<27", "duckdb>=1.2,<2", "pyrodigal-gv==0.3.2", "psutil>=7,<8"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
phanotate = ["phanotate==1.6.7", "setuptools==80.9.0"]

[project.scripts]
phageannoscope = "phageannoscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires installed callers and frozen real data"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/acquire_inphared_metadata.py" = ["I001"]
"scripts/rebuild_frozen_manifest.py" = ["I001"]
