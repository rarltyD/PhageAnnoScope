# CPU-only analysis environment (exact versions used in the study).
name: phageannoscope
channels: [conda-forge, bioconda]
dependencies:
  - python=3.13.16
  - biopython=1.88
  - pyarrow=25.0.0
  - pandas=3.0.6
  - numpy=2.5.4
  - matplotlib=3.11.2
  - pyrodigal=3.7.1
  - pip
  - pip:
      - pyrodigal-gv==0.3.2
      - duckdb==1.5.6
      - psutil==7.2.2
      - pyhmmer==0.12.3
      - scipy==1.18.1
      - statsmodels==0.15.0
      - patsy==1.0.3
      - pytest==9.1.1
